<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}后台管理{% endblock %} — 老铛的后台</title>
<meta name="robots" content="noindex, nofollow">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'PingFang SC','苹方','Microsoft YaHei',sans-serif;
    background:hsl(0,0%,3.9%);
    color:hsl(0,0%,98%);
    line-height:1.6;
    letter-spacing:0.02em;
  }
  a{color:inherit;}
  /* Layout */
  .admin-layout{display:flex;min-height:100vh}
  .admin-sidebar{
    width:220px;background:hsl(0,0%,5%);
    border-right:1px solid hsl(0,0%,14.9%);
    display:flex;flex-direction:column;
    position:fixed;top:0;left:0;bottom:0;z-index:10;
  }
  .admin-sidebar-brand{padding:1.25rem 1.25rem;border-bottom:1px solid hsl(0,0%,10%)}
  .admin-sidebar-nav{flex:1;padding:0.5rem 0;display:flex;flex-direction:column;gap:0.125rem}
  .admin-nav-item{
    display:flex;align-items:center;gap:0.5rem;
    padding:0.625rem 1.25rem;font-size:0.875rem;font-weight:500;
    color:hsl(0,0%,55%);text-decoration:none;
    transition:all 0.1s;letter-spacing:0.03em;
  }
  .admin-nav-item:hover{color:hsl(0,0%,90%);background:hsl(0,0%,10%)}
  .admin-nav-item.active{color:hsl(0,0%,98%);background:hsl(0,0%,12%);border-left:2px solid hsl(0,0%,80%)}
  .admin-sidebar-footer{padding:1rem 1.25rem;border-top:1px solid hsl(0,0%,10%)}
  .admin-main{margin-left:220px;flex:1;display:flex;flex-direction:column}
  .admin-topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:1rem 1.5rem;border-bottom:1px solid hsl(0,0%,10%);
    background:hsl(0,0%,4%);position:sticky;top:0;z-index:5;
  }
  .admin-topbar h1{font-size:1.125rem;font-weight:600;letter-spacing:0.04em}
  .admin-content{padding:1.5rem;flex:1}
  /* Cards */
  .admin-card{
    background:hsl(0,0%,7%);border:1px solid hsl(0,0%,14.9%);
    border-radius:12px;padding:1.25rem;margin-bottom:1rem;
  }
  .admin-card-header{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:1rem;
  }
  .admin-card-title{font-size:1rem;font-weight:600;letter-spacing:0.03em}
  /* Buttons */
  .btn{
    display:inline-flex;align-items:center;gap:0.375rem;
    padding:0.5rem 1rem;border-radius:8px;font-size:0.8125rem;
    font-weight:500;cursor:pointer;font-family:inherit;
    letter-spacing:0.03em;border:1px solid transparent;
    transition:all 0.15s;text-decoration:none;
  }
  .btn-primary{background:hsl(0,0%,90%);color:hsl(0,0%,5%);border-color:hsl(0,0%,70%)}
  .btn-primary:hover{background:hsl(0,0%,98%)}
  .btn-secondary{background:transparent;color:hsl(0,0%,70%);border-color:hsl(0,0%,18%)}
  .btn-secondary:hover{background:hsl(0,0%,10%);color:hsl(0,0%,90%)}
  .btn-danger{background:hsla(0,70%,40%,0.15);color:hsl(0,80%,65%);border-color:hsla(0,70%,40%,0.25)}
  .btn-danger:hover{background:hsla(0,70%,40%,0.25)}
  .btn-sm{padding:0.25rem 0.625rem;font-size:0.75rem}
  .btn:disabled{opacity:0.4;cursor:not-allowed}
  /* Forms */
  .form-group{margin-bottom:1rem}
  .form-label{display:block;font-size:0.8125rem;font-weight:500;margin-bottom:0.375rem;letter-spacing:0.03em}
  .form-input,.form-textarea,.form-select{
    width:100%;padding:0.5rem 0.75rem;background:hsl(0,0%,3.9%);
    border:1px solid hsl(0,0%,14.9%);border-radius:8px;
    font-size:0.875rem;color:hsl(0,0%,98%);font-family:inherit;
    outline:none;transition:border-color 0.15s;
  }
  .form-input:focus,.form-textarea:focus,.form-select:focus{
    border-color:hsl(0,0%,40%);box-shadow:0 0 0 2px hsla(0,0%,83.9%,0.08);
  }
  .form-textarea{min-height:6rem;resize:vertical;line-height:1.6}
  .form-select{appearance:none;cursor:pointer}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
  .form-hint{font-size:0.75rem;color:hsl(0,0%,50%);margin-top:0.25rem}
  /* Table */
  .admin-table{width:100%;border-collapse:collapse;font-size:0.875rem}
  .admin-table th{
    text-align:left;padding:0.625rem 0.75rem;font-weight:600;
    font-size:0.75rem;color:hsl(0,0%,50%);text-transform:uppercase;
    letter-spacing:0.05em;border-bottom:1px solid hsl(0,0%,14.9%);
  }
  .admin-table td{padding:0.75rem;border-bottom:1px solid hsl(0,0%,10%)}
  .admin-table tr:hover td{background:hsl(0,0%,6%)}
  /* Badge */
  .badge{
    display:inline-flex;padding:0.125rem 0.5rem;border-radius:9999px;
    font-size:0.6875rem;font-weight:500;letter-spacing:0.03em;
    background:hsl(0,0%,12%);border:1px solid hsl(0,0%,18%);
  }
  .badge-green{background:hsla(140,40%,20%,0.3);border-color:hsla(140,40%,30%,0.3);color:hsl(140,50%,65%)}
  .badge-yellow{background:hsla(45,60%,20%,0.3);border-color:hsla(45,60%,30%,0.3);color:hsl(45,60%,65%)}
  /* Toast */
  .toast{
    position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(100px);
    background:hsl(0,0%,12%);border:1px solid hsl(0,0%,20%);
    color:hsl(0,0%,90%);padding:0.625rem 1.5rem;border-radius:9999px;
    font-size:0.8125rem;z-index:100;transition:transform 0.3s ease;
  }
  .toast.show{transform:translateX(-50%) translateY(0)}
  .toast.success{border-color:hsla(140,40%,30%,0.5)}
  .toast.error{border-color:hsla(0,70%,40%,0.5)}
  /* Modal */
  .modal-overlay{
    position:fixed;inset:0;background:hsla(0,0%,0%,0.7);
    backdrop-filter:blur(4px);z-index:50;display:none;
    align-items:center;justify-content:center;padding:1rem;
  }
  .modal-overlay.open{display:flex}
  .modal{
    background:hsl(0,0%,7%);border:1px solid hsl(0,0%,14.9%);
    border-radius:12px;padding:1.5rem;width:100%;max-width:500px;
    max-height:85vh;overflow-y:auto;
  }
  .modal-title{font-size:1.125rem;font-weight:600;margin-bottom:1rem}
  .modal-actions{display:flex;gap:0.75rem;justify-content:flex-end;margin-top:1.5rem}
  /* File drop zone */
  .drop-zone{
    border:2px dashed hsl(0,0%,20%);border-radius:12px;
    padding:2rem;text-align:center;cursor:pointer;
    transition:all 0.15s;margin-bottom:1rem;
  }
  .drop-zone:hover,.drop-zone.drag-over{border-color:hsl(0,0%,45%);background:hsl(0,0%,6%)}
  .drop-zone-icon{font-size:2rem;margin-bottom:0.5rem}
  .drop-zone-text{font-size:0.875rem;color:hsl(0,0%,50%)}
  /* Media grid */
  .media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:0.75rem}
  .media-item{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;border:1px solid hsl(0,0%,14.9%)}
  .media-item img,.media-item video{width:100%;height:100%;object-fit:cover}
  .media-item-name{position:absolute;bottom:0;left:0;right:0;padding:0.25rem 0.5rem;background:hsla(0,0%,0%,0.7);font-size:0.625rem;color:hsl(0,0%,70%)}
  .media-item-insert{
    position:absolute;top:0.25rem;right:0.25rem;
    background:hsla(0,0%,0%,0.7);color:hsl(0,0%,98%);border:none;
    font-size:0.6875rem;padding:0.125rem 0.375rem;border-radius:4px;
    cursor:pointer;
  }
  /* Content editor */
  .editor-layout{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem}
  .editor-preview{
    background:hsl(0,0%,7%);border:1px solid hsl(0,0%,14.9%);
    border-radius:12px;padding:1.5rem;min-height:400px;overflow-y:auto;
    font-size:0.9375rem;line-height:1.8;letter-spacing:0.03em;
    color:hsl(0,0%,85%);
  }
  .editor-preview h1{font-size:1.5rem;margin:1.5rem 0 0.75rem}
  .editor-preview h2{font-size:1.25rem;margin:1.25rem 0 0.5rem}
  .editor-preview h3{font-size:1.1rem;margin:1rem 0 0.5rem}
  .editor-preview p{margin-bottom:0.75rem}
  .editor-preview blockquote{border-left:2px solid hsl(0,0%,20%);padding-left:1rem;color:hsl(0,0%,60%);font-style:italic;margin:0.75rem 0}
  .editor-preview code{background:hsl(0,0%,12%);padding:0.125rem 0.375rem;border-radius:4px;font-size:0.8125rem}
  .editor-preview pre{background:hsl(0,0%,12%);padding:1rem;border-radius:8px;overflow-x:auto;margin:0.75rem 0;border:1px solid hsl(0,0%,14.9%)}
  .editor-preview pre code{background:none;padding:0}
  .editor-preview table{width:100%;border-collapse:collapse;margin:1rem 0;font-size:0.875rem}
  .editor-preview th,.editor-preview td{border:1px solid hsl(0,0%,14.9%);padding:0.5rem 0.75rem;text-align:left}
  .editor-preview th{background:hsl(0,0%,10%);font-weight:600}
  .editor-preview img{max-width:100%;border-radius:8px;margin:0.75rem 0}
  .editor-preview video{max-width:100%;border-radius:8px;margin:0.75rem 0}
  /* Tags input */
  .tags-input-wrap{display:flex;flex-wrap:wrap;gap:0.375rem;padding:0.375rem;border:1px solid hsl(0,0%,14.9%);border-radius:8px;background:hsl(0,0%,3.9%);min-height:2.5rem;align-items:center}
  .tags-input-wrap:focus-within{border-color:hsl(0,0%,40%)}
  .tag-item{display:inline-flex;align-items:center;gap:0.25rem;padding:0.125rem 0.5rem;border-radius:9999px;background:hsl(0,0%,12%);border:1px solid hsl(0,0%,18%);font-size:0.75rem}
  .tag-remove{cursor:pointer;opacity:0.5;font-size:0.75rem;line-height:1;background:none;border:none;color:inherit;padding:0;margin-left:0.125rem}
  .tag-remove:hover{opacity:1}
  .tags-input{border:none;background:none;color:hsl(0,0%,98%);font-size:0.8125rem;font-family:inherit;outline:none;flex:1;min-width:6rem;padding:0.25rem}
  /* Empty state */
  .empty-state{text-align:center;padding:3rem 1.5rem;color:hsl(0,0%,50%)}
  .empty-state-icon{font-size:2.5rem;margin-bottom:0.75rem}
  .empty-state-text{font-size:0.9375rem}
  /* Misc */
  .text-muted{color:hsl(0,0%,50%)}
  .mb-4{margin-bottom:1rem}
  .mt-4{margin-top:1rem}
  .gap-2{gap:0.5rem}
  .flex{display:flex}
  .flex-wrap{flex-wrap:wrap}
  .items-center{align-items:center}
  .justify-between{justify-content:space-between}
  .flex-1{flex:1}
</style>
{% block extra_head %}{% endblock %}
</head>
<body>
<div class="admin-layout">
  {% include "admin/_sidebar.html" %}
  <main class="admin-main">
    <header class="admin-topbar">
      <h1>{% block page_title %}后台{% endblock %}</h1>
      <div style="display:flex;align-items:center;gap:1rem;">
        <span style="font-size:0.8125rem;color:hsl(0,0%,55%);">{{ user.username }}</span>
        <a href="/admin/logout" style="color:hsl(0,0%,55%);text-decoration:none;font-size:0.8125rem;">退出</a>
      </div>
    </header>
    <div class="admin-content">
      {% block content %}{% endblock %}
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>
{% block extra_scripts %}{% endblock %}
<script>
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast ' + (type||'') + ' show';
  setTimeout(()=>t.classList.remove('show'), 2500);
}
</script>
</body>
</html>
