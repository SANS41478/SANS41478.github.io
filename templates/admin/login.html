<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 — 老铛的后台</title>
<meta name="robots" content="noindex, nofollow">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'PingFang SC', '苹方', 'Microsoft YaHei', sans-serif;
    background: hsl(0, 0%, 3.9%);
    color: hsl(0, 0%, 98%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }
  .login-card {
    background: hsl(0, 0%, 7%);
    border: 1px solid hsl(0, 0%, 14.9%);
    border-radius: 16px;
    padding: 2.5rem 2rem;
    width: 100%;
    max-width: 400px;
  }
  .login-title {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    margin-bottom: 0.25rem;
  }
  .login-subtitle {
    font-size: 0.875rem;
    color: hsl(0, 0%, 63.9%);
    margin-bottom: 2rem;
  }
  .form-group { margin-bottom: 1.25rem; }
  .form-label {
    display: block;
    font-size: 0.8125rem;
    font-weight: 500;
    margin-bottom: 0.375rem;
    letter-spacing: 0.03em;
  }
  .form-input {
    width: 100%;
    padding: 0.625rem 0.875rem;
    background: hsl(0, 0%, 3.9%);
    border: 1px solid hsl(0, 0%, 14.9%);
    border-radius: 8px;
    font-size: 0.9375rem;
    color: hsl(0, 0%, 98%);
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s;
  }
  .form-input:focus {
    border-color: hsl(0, 0%, 40%);
    box-shadow: 0 0 0 2px hsla(0, 0%, 83.9%, 0.1);
  }
  .btn {
    width: 100%;
    padding: 0.75rem;
    background: hsl(0, 0%, 98%);
    color: hsl(0, 0%, 3.9%);
    border: none;
    border-radius: 8px;
    font-size: 0.9375rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 0.03em;
    transition: opacity 0.15s;
    margin-top: 0.5rem;
  }
  .btn:hover { opacity: 0.9; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .error-msg {
    background: hsla(0, 63%, 35%, 0.2);
    border: 1px solid hsla(0, 63%, 35%, 0.3);
    color: hsl(0, 70%, 70%);
    padding: 0.625rem 0.875rem;
    border-radius: 8px;
    font-size: 0.8125rem;
    margin-bottom: 1rem;
  }
  .back-link {
    display: block;
    text-align: center;
    margin-top: 1.5rem;
    font-size: 0.8125rem;
    color: hsl(0, 0%, 45%);
    text-decoration: none;
    transition: color 0.15s;
  }
  .back-link:hover { color: hsl(0, 0%, 80%); }
</style>
</head>
<body>
<div class="login-card">
  <h1 class="login-title">后台管理</h1>
  <p class="login-subtitle">老铛的创世区块 · 管理员登录</p>

  {% if error %}
  <div class="error-msg">{{ error }}</div>
  {% endif %}

  <form id="loginForm" method="post" action="/admin/login">
    <div class="form-group">
      <label class="form-label" for="username">用户名</label>
      <input class="form-input" type="text" id="username" name="username" placeholder="输入用户名" required autofocus>
    </div>
    <div class="form-group">
      <label class="form-label" for="password">密码</label>
      <input class="form-input" type="password" id="password" name="password" placeholder="输入密码" required>
    </div>
    <button class="btn" type="submit" id="submitBtn">登 录</button>
  </form>

  <a href="/" class="back-link">← 返回网站首页</a>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = '登录中...';

  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;

  try {
    const resp = await fetch('/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    if (resp.ok) {
      window.location.href = '/admin';
    } else {
      const data = await resp.json();
      alert(data.error || '登录失败');
    }
  } catch (err) {
    alert('登录失败: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '登 录';
  }
});
</script>
</body>
</html>
